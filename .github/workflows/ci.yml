name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    # 固定 24.04：ubuntu-latest 已迁到 26.04，setup-python 在 26.04 上暂无 3.9 的构建
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test the CLI on sample data
        run: python -m src.cli data/matches.csv --no-detail
